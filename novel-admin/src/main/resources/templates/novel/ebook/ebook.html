<!DOCTYPE html>
<html>
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="gray-bg">
<div class="wrapper wrapper-content ">
    <div class="col-sm-12">
        <div class="ibox">
            <div class="ibox-body">
                <div class="fixed-table-toolbar">
                    <div class="columns pull-left">
                        <button shiro:hasPermission="novel:ebook:add" type="button" class="btn btn-primary" onclick="add()">
                            <i class="fa fa-plus" aria-hidden="true"></i>添加
                        </button>
                        <button shiro:hasPermission="novel:ebook:batchRemove" type="button" class="btn btn-danger" onclick="batchRemove()">
                            <i class="fa fa-trash" aria-hidden="true"></i>删除
                        </button>
                    </div>
                    <div class="columns pull-right">
                        <button class="btn btn-success" onclick="reLoad()">查询</button>
                    </div>
                    <form id="searchForm">
                        <div class="columns pull-right col-md-2">
                            <select id="status" name="status" class="form-control">
                                <option value="">全部状态</option>
                                <option value="1">上架</option>
                                <option value="0">下架</option>
                            </select>
                        </div>
                        <div class="columns pull-right col-md-2">
                            <select id="fileFormat" name="fileFormat" class="form-control">
                                <option value="">全部格式</option>
                                <option value="pdf">PDF</option>
                                <option value="txt">TXT</option>
                                <option value="epub">EPUB</option>
                                <option value="azw3">AZW3</option>
                                <option value="mobi">MOBI</option>
                            </select>
                        </div>
                        <div class="columns pull-right col-md-2">
                            <input id="isbn" name="isbn" type="text" class="form-control" placeholder="ISBN">
                        </div>
                        <div class="columns pull-right col-md-2">
                            <input id="authorName" name="authorName" type="text" class="form-control" placeholder="作者">
                        </div>
                        <div class="columns pull-right col-md-2">
                            <input id="bookName" name="bookName" type="text" class="form-control" placeholder="书名">
                        </div>
                    </form>
                </div>
                <table id="exampleTable" data-mobile-responsive="true"></table>
            </div>
        </div>
    </div>
</div>
<div>
    <script type="text/javascript">
        var s_detail_h = 'hidden';
        var s_edit_h = 'hidden';
        var s_remove_h = 'hidden';
    </script>
</div>
<div shiro:hasPermission="novel:ebook:detail">
    <script type="text/javascript">s_detail_h = '';</script>
</div>
<div shiro:hasPermission="novel:ebook:edit">
    <script type="text/javascript">s_edit_h = '';</script>
</div>
<div shiro:hasPermission="novel:ebook:remove">
    <script type="text/javascript">s_remove_h = '';</script>
</div>
<div th:include="include :: footer"></div>
<script type="text/javascript" src="/js/appjs/novel/ebook/ebook.js?v=2026061801"></script>
</body>
</html>
