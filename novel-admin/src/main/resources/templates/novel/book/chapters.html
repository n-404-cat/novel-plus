<!DOCTYPE html>
<html>
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="gray-bg">
<div class="wrapper wrapper-content ">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5 th:text="${book.bookName} + ' - 章节与正文工作台'"></h5>
                </div>
                <div class="ibox-content" style="height: 720px; overflow-y: auto;">
                    <input id="id" th:value="${book.id}" type="hidden">
                    <div class="row">
                        <div class="col-sm-4" style="border-right: 1px solid #eee;">
                            <ul class="list-group" id="chapterList" style="max-height: 640px; overflow-y: auto; cursor: pointer;"></ul>
                        </div>
                        <div class="col-sm-8">
                            <div class="form-group">
                                <label class="control-label">章节标题</label>
                                <input id="chapterTitleInput" class="form-control" type="text" placeholder="请选择章节后编辑标题">
                            </div>
                            <div class="form-group">
                                <label class="control-label">正文预览</label>
                                <div id="chapterContentPreview" style="height: 220px; overflow-y: auto; padding: 12px 15px; border: 1px solid #e5e6e7; background: #fff; line-height: 1.9; color: #333; font-size: 15px;"></div>
                            </div>
                            <div class="form-group">
                                <label class="control-label">章节正文</label>
                                <textarea id="chapterContentInput" class="form-control" rows="24" placeholder="请选择章节后编辑正文"></textarea>
                            </div>
                            <div class="form-group">
                                <button type="button" class="btn btn-primary btn-sm" onclick="saveChapterContent()">保存章节</button>
                                <button type="button" class="btn btn-default btn-sm" onclick="parent.layer.close(parent.layer.getFrameIndex(window.name))">关闭</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:include="include::footer"></div>
<script type="text/javascript">
    var currentIndexId = null;

    $(function() {
        loadChapters();
    });

    function loadChapters() {
        var bookId = $("#id").val();
        $.get("/novel/book/indexList/" + bookId, function(res) {
            if (res.code === 0 && res.data) {
                var html = '';
                for (var i = 0; i < res.data.length; i++) {
                    var chapter = res.data[i];
                    html += '<li class="list-group-item" id="chapter-item-' + chapter.id + '" data-id="' + chapter.id + '" data-name="' + escapeHtmlAttr(chapter.indexName) + '">' + chapter.indexName + '</li>';
                }
                $("#chapterList").html(html);
                $("#chapterList .list-group-item").off("click").on("click", function () {
                    loadContent($(this).data("id"), $(this).data("name"));
                });
                if (res.data.length > 0) {
                    loadContent(res.data[0].id, res.data[0].indexName);
                }
            }
        });
    }

    function escapeHtmlAttr(text) {
        return (text || "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/'/g, "&#39;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function loadContent(indexId, indexName) {
        currentIndexId = indexId;
        $("#chapterTitleInput").val(indexName);
        $("#chapterContentInput").val("正在加载正文...");
        $("#chapterContentPreview").html("正在加载正文预览...");
        $("#chapterList .list-group-item").removeClass("active");
        $("#chapter-item-" + indexId).addClass("active");
        $.get("/novel/book/content/" + indexId, function(res) {
            if (res.code === 0) {
                var content = res.data && res.data.content ? res.data.content : "";
                $("#chapterContentInput").val(content || "（该章节暂无内容）");
                renderChapterPreview(content);
            } else {
                $("#chapterContentInput").val("加载失败");
                $("#chapterContentPreview").html("<span style='color:red;'>加载失败</span>");
            }
        });
    }

    function renderChapterPreview(content) {
        var html = content || "（该章节暂无内容）";
        $("#chapterContentPreview").html(html);
    }

    function saveChapterContent() {
        if (!currentIndexId) {
            layer.msg("请先选择章节");
            return;
        }
        $.ajax({
            type: "POST",
            url: "/novel/book/content/update",
            data: {
                indexId: currentIndexId,
                indexName: $("#chapterTitleInput").val(),
                content: $("#chapterContentInput").val()
            },
            success: function(res) {
                if (res.code === 0) {
                    $("#chapter-item-" + currentIndexId).text($("#chapterTitleInput").val());
                    renderChapterPreview($("#chapterContentInput").val());
                    parent.layer.msg("章节保存成功");
                } else {
                    parent.layer.alert(res.msg || "保存失败");
                }
            },
            error: function() {
                parent.layer.alert("保存章节失败");
            }
        });
    }

    $("#chapterContentInput").on("input propertychange", function () {
        renderChapterPreview($(this).val());
    });
</script>
</body>
</html>
