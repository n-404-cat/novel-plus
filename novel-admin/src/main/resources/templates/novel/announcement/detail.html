<!DOCTYPE html>
<html>
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="gray-bg">
<div class="wrapper wrapper-content ">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-content">
                    <form class="form-horizontal m-t">
                        <div class="form-group">
                            <label class="col-sm-3 control-label">标题：</label>
                            <div style="padding-top:8px" class="col-sm-8" th:text="${announcement.title}"></div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">类型：</label>
                            <div style="padding-top:8px" class="col-sm-8"
                                 th:text="${announcement.type == 2 ? '首页滚动' : (announcement.type == 3 ? '弹窗公告' : (announcement.type == 4 ? '右下角公告' : '文章公告'))}"></div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">状态：</label>
                            <div style="padding-top:8px" class="col-sm-8" th:text="${announcement.status == 1 ? '上架' : '下架'}"></div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">关闭策略：</label>
                            <div style="padding-top:8px" class="col-sm-8" th:text="${announcement.closeMode == 1 ? '关闭后永不提示' : '下次打开重新提示'}"></div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">内容：</label>
                            <div style="padding-top:8px" class="col-sm-8" th:utext="${announcement.content}"></div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:include="include::footer"></div>
</body>
</html>
