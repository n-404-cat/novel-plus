<!DOCTYPE html>
<html>
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="gray-bg">
<div class="wrapper wrapper-content ">
    <div class="col-sm-12">
        <div class="ibox">
            <div class="ibox-body">
                <div class="fixed-table-toolbar">
                    <div class="columns pull-left">
                        <button shiro:hasPermission="novel:announcement:add" type="button"
                                class="btn btn-primary" onclick="add()">
                            <i class="fa fa-plus" aria-hidden="true"></i>添加
                        </button>
                        <button shiro:hasPermission="novel:announcement:batchRemove" type="button"
                                class="btn btn-danger" onclick="batchRemove()">
                            <i class="fa fa-trash" aria-hidden="true"></i>删除
                        </button>
                    </div>
                    <div class="columns pull-right">
                        <button class="btn btn-success" onclick="reLoad()">查询</button>
                    </div>
                    <form id="searchForm">
                        <div class="columns pull-right col-md-2">
                            <select id="status" name="status" class="form-control">
                                <option value="">全部状态</option>
                                <option value="1">上架</option>
                                <option value="0">下架</option>
                            </select>
                        </div>
                        <div class="columns pull-right col-md-2">
                            <select id="type" name="type" class="form-control">
                                <option value="">全部类型</option>
                                <option value="1">文章公告</option>
                                <option value="2">首页滚动</option>
                                <option value="3">弹窗公告</option>
                                <option value="4">右下角公告</option>
                            </select>
                        </div>
                        <div class="columns pull-right col-md-2">
                            <input id="title" name="title" type="text" class="form-control" placeholder="标题">
                        </div>
                    </form>
                </div>
                <table id="exampleTable" data-mobile-responsive="true"></table>
            </div>
        </div>
    </div>
</div>
<div>
    <script type="text/javascript">
        var s_detail_h = 'hidden';
        var s_edit_h = 'hidden';
        var s_remove_h = 'hidden';
    </script>
</div>
<div shiro:hasPermission="novel:announcement:detail">
    <script type="text/javascript">s_detail_h = '';</script>
</div>
<div shiro:hasPermission="novel:announcement:edit">
    <script type="text/javascript">s_edit_h = '';</script>
</div>
<div shiro:hasPermission="novel:announcement:remove">
    <script type="text/javascript">s_remove_h = '';</script>
</div>
<div th:include="include :: footer"></div>
<script type="text/javascript" src="/js/appjs/novel/announcement/announcement.js?v=2026061601"></script>
</body>
</html>
