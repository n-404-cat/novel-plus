<!DOCTYPE html>
<html>
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="gray-bg">
<div class="wrapper wrapper-content">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-content">
                    <form class="form-horizontal m-t" id="crawlForm">
                        <div class="form-group">
                            <label class="col-sm-2 control-label">内置源：</label>
                            <div class="col-sm-4">
                                <select id="sourceCode" name="sourceCode" class="form-control"></select>
                            </div>
                            <div class="col-sm-5 help-block" id="sourceTip"></div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-2 control-label">新闻地址：</label>
                            <div class="col-sm-9">
                                <input id="url" name="url" class="form-control" type="text"
                                       placeholder="请输入新闻详情页 URL">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-2 control-label">类别：</label>
                            <div class="col-sm-4">
                                <select id="catId" name="catId" class="form-control"></select>
                                <input type="hidden" id="catName" name="catName"/>
                            </div>
                            <label class="col-sm-2 control-label">状态：</label>
                            <div class="col-sm-3">
                                <label class="radio-inline">
                                    <input type="radio" name="status" value="1" checked="checked"> 上架
                                </label>
                                <label class="radio-inline">
                                    <input type="radio" name="status" value="0"> 下架
                                </label>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="col-sm-9 col-sm-offset-2">
                                <button type="button" class="btn btn-info" onclick="previewNews()">
                                    <i class="fa fa-eye"></i>预览
                                </button>
                                <button type="button" class="btn btn-primary" onclick="saveCrawlNews()">
                                    <i class="fa fa-save"></i>保存为新闻
                                </button>
                            </div>
                        </div>
                    </form>
                    <div class="hr-line-dashed"></div>
                    <div class="row">
                        <div class="col-sm-12">
                            <h4 id="previewTitle">采集预览</h4>
                            <div id="previewContent"
                                 style="min-height:260px;max-height:360px;overflow:auto;border:1px solid #e5e6e7;padding:15px;background:#fff;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:include="include::footer"></div>
<script type="text/javascript" src="/js/appjs/novel/news/crawl.js?v=2026061601"></script>
</body>
</html>
