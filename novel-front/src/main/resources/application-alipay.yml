alipay:
  # 支付参数只允许使用环境变量或本地私有配置覆盖，禁止把真实值提交到仓库
  app-id: ${ALIPAY_APP_ID:demo-app-id}
  merchant-private-key: ${ALIPAY_MERCHANT_PRIVATE_KEY:demo-merchant-private-key}
  public-key: ${ALIPAY_PUBLIC_KEY:demo-alipay-public-key}
  notify-url: ${ALIPAY_NOTIFY_URL:http://127.0.0.1:8083/pay/aliPay/notify}
  return-url: ${ALIPAY_RETURN_URL:http://127.0.0.1:8083/user/userinfo.html}
  #签名方式
  sign-type: RSA2
  #编码
  charset: utf-8
  #支付宝网关
  gateway-url: ${ALIPAY_GATEWAY_URL:https://openapi-sandbox.dl.alipaydev.com/gateway.do}
